
conky.config = {
    background = false,
    use_xft = true,
    font = 'JetBrains Mono:size=8',
    xftalpha = 1.0,
    update_interval = 1.0,
    total_run_times = 0,

    out_to_x = false,
    out_to_wayland = true,
    own_window = true,
    own_window_type = 'desktop',
    own_window_transparent = false,
    own_window_argb_visual = true,
    own_window_argb_value = 235,
    own_window_colour = '090D12',
    own_window_class = 'ConkyCPU',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',

    draw_borders = false,
    border_width = 0,
    border_inner_margin = 12,
    border_outer_margin = 0,

    draw_graph_borders = true,
    default_outline_color = '#00F0FF',

    draw_shades = false,
    draw_outline = false,

    double_buffer = true,
    minimum_width = 380,
    maximum_width = 400,

    default_color = '#FFFFFF',
    color1 = '#00F0FF',
    color2 = '#C9D1D9',
    color3 = '#39D353',
    color4 = '#FF2A6D',
    color5 = '#D2A8FF',

    alignment = 'top_right',
    gap_x = 25,
    gap_y = 35,
    no_buffers = true,
    uppercase = true,
    cpu_avg_samples = 2,
    use_spacer = 'none',
    short_units = true,
}

conky.text = [[
${color1}${font JetBrains Mono:style=Bold:size=11}CPU TELEMETRY ${hr 2}$font$color
${color2}MODELO:$color ${color1}Ultra 7 255HX$color ${alignr}${color2}FREC:$color ${freq_g}GHz
${color2}USO TOTAL:$color ${cpu}% ${alignr}${color2}TEMP CPU:$color ${color4}${execi 2 sensors | grep -m1 -E 'Package id 0:|Core 0:|temp1:' | awk '{print $4}' | tr -d '+'}$color
${color1}${cpubar 4,380}$color

${color1}${font JetBrains Mono:style=Bold:size=9}NÚCLEOS (20 CORES) ${hr 1}$font$color
${color2}CPU01$color ${cpu cpu1}% ${color1}${cpubar cpu1 4,110}$color ${alignr}${color2}CPU11$color ${cpu cpu11}% ${color3}${cpubar cpu11 4,110}$color
${color2}CPU02$color ${cpu cpu2}% ${color1}${cpubar cpu2 4,110}$color ${alignr}${color2}CPU12$color ${cpu cpu12}% ${color3}${cpubar cpu12 4,110}$color
${color2}CPU03$color ${cpu cpu3}% ${color1}${cpubar cpu3 4,110}$color ${alignr}${color2}CPU13$color ${cpu cpu13}% ${color3}${cpubar cpu13 4,110}$color
${color2}CPU04$color ${cpu cpu4}% ${color1}${cpubar cpu4 4,110}$color ${alignr}${color2}CPU14$color ${cpu cpu14}% ${color3}${cpubar cpu14 4,110}$color
${color2}CPU05$color ${cpu cpu5}% ${color1}${cpubar cpu5 4,110}$color ${alignr}${color2}CPU15$color ${cpu cpu15}% ${color3}${cpubar cpu15 4,110}$color
${color2}CPU06$color ${cpu cpu6}% ${color1}${cpubar cpu6 4,110}$color ${alignr}${color2}CPU16$color ${cpu cpu16}% ${color3}${cpubar cpu16 4,110}$color
${color2}CPU07$color ${cpu cpu7}% ${color1}${cpubar cpu7 4,110}$color ${alignr}${color2}CPU17$color ${cpu cpu17}% ${color3}${cpubar cpu17 4,110}$color
${color2}CPU08$color ${cpu cpu8}% ${color1}${cpubar cpu8 4,110}$color ${alignr}${color2}CPU18$color ${cpu cpu18}% ${color3}${cpubar cpu18 4,110}$color
${color2}CPU09$color ${cpu cpu9}% ${color3}${cpubar cpu9 4,110}$color ${alignr}${color2}CPU19$color ${cpu cpu19}% ${color5}${cpubar cpu19 4,110}$color
${color2}CPU10$color ${cpu cpu10}% ${color3}${cpubar cpu10 4,110}$color ${alignr}${color2}CPU20$color ${cpu cpu20}% ${color5}${cpubar cpu20 4,110}$color

${color1}${font JetBrains Mono:style=Bold:size=11}GPU TELEMETRY ${hr 2}$font$color
${color2}DISPOSITIVO:$color ${execi 60 nvidia-smi --query-gpu=name --format=csv,noheader 2>/dev/null || echo "RTX 5060"}
${color2}USO GPU:$color ${execi 2 nvidia-smi --query-gpu=utilization.gpu --format=csv,noheader 2>/dev/null || echo "0 %"} ${alignr}${color2}TEMP GPU:$color ${color4}${execi 2 nvidia-smi --query-gpu=temperature.gpu --format=csv,noheader 2>/dev/null || echo "0"}°C$color
${color2}VRAM:$color ${execi 2 nvidia-smi --query-gpu=memory.used --format=csv,noheader 2>/dev/null || echo "0 MiB"} / ${execi 60 nvidia-smi --query-gpu=memory.total --format=csv,noheader 2>/dev/null || echo "8188 MiB"}

${color1}${font JetBrains Mono:style=Bold:size=11}VENTILADORES ${hr 2}$font$color
${color2}FAN 1 (CPU):$color ${execi 2 sensors | grep -i 'fan1' | awk '{print $2, $3}' || echo "N/A"} ${alignr}${color2}FAN 2 (GPU):$color ${execi 2 sensors | grep -i 'fan2' | awk '{print $2, $3}' || echo "N/A"}

${color1}${font JetBrains Mono:style=Bold:size=11}BATTERY & POWER ${hr 2}$font$color
${color2}ALIMENTACIÓN AC:$color ${execi 2 sh -c 'grep -q 1 /sys/class/power_supply/AD*/online /sys/class/power_supply/AC*/online 2>/dev/null && echo "${color3}CONECTADO (CARGADOR)$color" || echo "${color4}DESCONECTADO (BATERÍA)$color"'}
${color2}ESTADO CARGA:$color ${battery_short BAT0} ${alignr}${color2}PORCENTAJE:$color ${battery_percent BAT0}%
${color2}CONSUMO POTENCIA:$color ${execi 2 cat /sys/class/power_supply/BAT0/power_now 2>/dev/null | awk '{printf "%.2f W", $1/1000000}' || echo "0.00 W"}
${color2}CAPACIDAD ENERGÍA:$color ${execi 10 cat /sys/class/power_supply/BAT0/energy_now 2>/dev/null | awk '{printf "%.2f Wh", $1/1000000}' || echo "0.00 Wh"} / ${execi 60 cat /sys/class/power_supply/BAT0/energy_full 2>/dev/null | awk '{printf "%.2f Wh", $1/1000000}' || echo "0.00 Wh"}
${color2}TIEMPO RESTANTE:$color ${battery_time BAT0}
${color3}${battery_bar 5,380 BAT0}$color
]]
