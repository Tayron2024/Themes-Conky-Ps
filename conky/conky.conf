conky.config = {
    background = false,
    use_xft = true,
    font = 'JetBrains Mono:size=8',
    xftalpha = 1.0,
    update_interval = 1.0,
    total_run_times = 0,

    out_to_x = false,
    out_to_wayland = true,
    own_window = true,
    own_window_type = 'desktop',
    own_window_transparent = false,
    own_window_argb_visual = true,
    own_window_argb_value = 230,
    own_window_colour = '090D12',
    own_window_class = 'Conky',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',

    draw_borders = false,
    border_width = 0,
    border_inner_margin = 12,
    border_outer_margin = 0,

    draw_graph_borders = true,
    default_outline_color = '#00F0FF',

    draw_shades = false,
    draw_outline = false,

    double_buffer = true,
    minimum_width = 380,
    maximum_width = 400,

    default_color = '#FFFFFF',
    color1 = '#00F0FF',
    color2 = '#C9D1D9',
    color3 = '#39D353',
    color4 = '#FF2A6D',
    color5 = '#D2A8FF',

    alignment = 'top_left',
    gap_x = 25,
    gap_y = 35,
    no_buffers = true,
    uppercase = true,
    cpu_avg_samples = 2,
    net_avg_samples = 2,
    diskio_avg_samples = 2,
    use_spacer = 'none',
    short_units = true,
}

conky.text = [[
${alignc}${font JetBrains Mono:style=Bold:size=28}${color1}${time %H:%M}${font}${color2}:${time %S}$color
${alignc}${font JetBrains Mono:style=Bold:size=9}${color2}${time %A, %d DE %B DE %Y}$font$color

${color1}${font JetBrains Mono:style=Bold:size=11}SYSTEM ${hr 2}$font$color
${color2}USUARIO:$color ${execi 3600 whoami}@${nodename}
${color2}OS:$color Nobara Linux
${color2}KERNEL:$color ${kernel}
${color2}UPTIME:$color $uptime ${alignr}${color2}CARGA MEDIA:$color ${loadavg 1}
${color2}PROCESOS:$color $processes ($running_processes ACTIVOS)

${color1}${font JetBrains Mono:style=Bold:size=11}CLIMA & UBICACIÓN ${hr 2}$font$color
${color2}ESTADO:$color ${execi 1800 curl -s "wttr.in?format=%C+%t" | tr 'a-z' 'A-Z'} ${alignr}${color2}VIENTO:$color ${execi 1800 curl -s "wttr.in?format=%w"}
${color2}HUMEDAD:$color ${execi 1800 curl -s "wttr.in?format=%h"} ${alignr}${color2}UBICACIÓN:$color ${execi 1800 curl -s "wttr.in?format=%l" | tr 'a-z' 'A-Z'}

${color1}${font JetBrains Mono:style=Bold:size=11}MEMORY & SWAP ${hr 2}$font$color
${color2}RAM:$color $mem / $memmax ${alignr}${color3}${membar 5,115}$color
${color2}SWAP:$color $swap / $swapmax ${alignr}${color5}${swapbar 5,115}$color
${color1}${memgraph 20,380 00F0FF 00F0FF -t}$color

${color1}${font JetBrains Mono:style=Bold:size=11}STORAGE & DISK I/O ${hr 2}$font$color
${color2}RAÍZ (/):$color ${fs_used /} / ${fs_size /} ${alignr}${color1}${fs_bar 5,95 /}$color
${color2}HOME (/HOME):$color ${fs_used /home} / ${fs_size /home} ${alignr}${color1}${fs_bar 5,95 /home}$color
${color2}LECTURA:$color ${diskio_read} ${alignr}${color2}ESCRITURA:$color ${diskio_write}
${color1}${diskiograph 20,380 00F0FF 00F0FF -t}$color

${color1}${font JetBrains Mono:style=Bold:size=11}TOP PROCESSES ${hr 2}$font$color
${color2}NOMBRE${goto 190}PID${goto 260}CPU%${goto 330}RAM%$color
${color1}${top name 1}${goto 190}${top pid 1}${goto 260}${top cpu 1}%${goto 330}${top mem 1}%$color
${top name 2}${goto 190}${top pid 2}${goto 260}${top cpu 2}%${goto 330}${top mem 2}%
${top name 3}${goto 190}${top pid 3}${goto 260}${top cpu 3}%${goto 330}${top mem 3}%
${top name 4}${goto 190}${top pid 4}${goto 260}${top cpu 4}%${goto 330}${top mem 4}%

${color1}${font JetBrains Mono:style=Bold:size=11}NETWORK (${gw_iface}) ${hr 2}$font$color
${color2}IP LOCAL:$color ${addr ${gw_iface}} ${alignr}${color2}IP PÚBLICA:$color ${execi 3600 curl -s https://api.ipify.org}
${color2}CONEXIONES:$color ${tcp_portmon 1 65535 count} ${alignr}${color2}ESTADO VPN:$color ${if_up tun0}${color3}ACTIVA$color${else}${color2}INACTIVA$color${endif}
${color2}DESCARGA:$color ${downspeed ${gw_iface}}/s ${alignr}${color2}SUBIDA:$color ${upspeed ${gw_iface}}/s
${color1}${downspeedgraph ${gw_iface} 20,185 00F0FF 00F0FF -t}$color ${alignr}${color1}${upspeedgraph ${gw_iface} 20,185 00F0FF 00F0FF -t}$color
${color2}TOTAL BAJADO:$color ${totaldown ${gw_iface}} ${alignr}${color2}TOTAL SUBIDO:$color ${totalup ${gw_iface}}

${color1}${font JetBrains Mono:style=Bold:size=11}PAQUETES & SOFTWARE ${hr 2}$font$color
${color2}PAQUETES RPM:$color ${execi 3600 rpm -qa | wc -l} ${alignr}${color2}FLATPAKS:$color ${execi 3600 flatpak list --app | wc -l}
${color2}GESTOR PAQUETES:$color DNF5 (NOBARA) ${alignr}${color2}SHELL:$color ${execi 3600 echo $SHELL | awk -F'/' '{print $NF}'}

${color1}${font JetBrains Mono:style=Bold:size=11}SECURITY & SESSIONS ${hr 2}$font$color
${color2}SERVIDOR GRÁFICO:$color ${execi 3600 echo $XDG_SESSION_TYPE | tr 'a-z' 'A-Z'} ${alignr}${color2}USUARIOS SESIÓN:$color ${user_names}
${color2}SESIONES LOGINS:$color ${user_terms} ${alignr}${color2}TTY ACTUAL:$color ${execi 3600 tty | awk -F'/' '{print $NF}'}
]]
